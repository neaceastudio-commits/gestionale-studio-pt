<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp · Direzione NEACEA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#182b25;font:16px/1.5 system-ui,sans-serif}header{background:#173b31;color:white;padding:16px max(5%,calc((100% - 980px)/2));font-weight:700}main{max-width:1020px;padding:28px 20px;margin:auto}h1{font-size:clamp(30px,5vw,44px);margin:0;letter-spacing:-.045em}h2{font-size:23px;margin:4px 0}small,p{color:#486258}nav{display:flex;gap:8px;margin:24px 0}button,select,input{font:inherit;border:1px solid #afc1b8;border-radius:8px;background:white;color:inherit;padding:9px 14px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true],.primary{background:#205743;color:white}section{background:white;border:1px solid #d9e3dc;border-radius:16px;padding:24px;margin:14px 0}label{display:block;margin:12px 0}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ce8d18}output{display:block;padding:12px;background:#edf4ee;border-radius:8px}li{margin:8px 0}a{color:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}
</style><header>NEACEA STUDIO · Direzione</header><main><small>Calendario PT / Messaggistica</small><h1>WhatsApp</h1><p>Anteprima con dati fittizi. Tutte le azioni sono simulate.</p><nav aria-label="Destinatari"><button id="clients" aria-pressed="true">Clienti</button><button id="trainers" aria-pressed="false">PT</button></nav>
<section id="clientPanel"><h2>Rubrica clienti</h2><label>Cliente <select id="client"><option>Alba Demo</option><option>Bruno Demo</option></select></label><p id="summary"></p><label><input type="checkbox" id="consent"> Consenso agli avvisi WhatsApp (simulato)</label><div class="actions"><button class="primary" id="session">Simula una seduta</button><button id="delivery">Simula consegna</button></div><h3>Storico messaggi</h3><output id="history" aria-live="polite"></output></section>
<section hidden id="ptPanel"><h2>Agenda del trainer</h2><label>PT <select id="trainer"><option>PT A · Demo</option><option>PT B · Demo</option></select></label><label>Data <input id="day" type="date"></label><p id="agenda"></p><button class="primary" id="ptSend">Simula consegna agenda</button><h3>Storico agende</h3><output id="ptHistory" aria-live="polite"></output></section><button id="reset">Ricomincia la simulazione</button></main>
<script>
const el=id=>document.getElementById(id);
const key='neacea-whatsapp-bozza-1';
function fresh(){return {clients:[{left:3,ok:true},{left:3,ok:false}],agendas:{}}}
let state=fresh();
try{state=JSON.parse(sessionStorage.getItem(key))||state}catch{}
const now=()=>new Date().toLocaleString('it-IT');
const date=new Date();el('day').value=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
function current(){return state.clients[el('client').selectedIndex]}
function agendaKey(){return el('trainer').selectedIndex+'|'+el('day').value}
function render(){
 const c=current();el('summary').textContent='Pacchetto di prova · '+c.left+' sedute residue';el('consent').checked=c.ok;
 el('session').disabled=c.left===0;el('delivery').disabled=!c.ok||!c.created||!!c.delivered;
 el('history').textContent=c.created?'Restano 2 sedute · '+(c.delivered?'Consegnato · simulazione · '+c.delivered:c.ok?'Da inviare · '+c.created:'Sospeso · consenso assente'):c.left<=2&&!c.ok?'Nessun avviso preparato · consenso assente':'Nessun messaggio';
 const name=el('trainer').value;el('agenda').textContent=el('day').value?name+' · '+el('day').value+' · '+(el('trainer').selectedIndex?'15:00 Bruno Demo':'09:00 Alba Demo'):'Seleziona una data';
 el('ptHistory').textContent=Object.entries(state.agendas).filter(([k])=>k.startsWith(el('trainer').selectedIndex+'|')).map(([k,v])=>k.split('|')[1]+' · Consegnato · simulazione · '+v).reverse().join('\n')||'Nessuna agenda inviata';el('ptHistory').style.whiteSpace='pre-line';
 el('ptSend').disabled=!el('day').value||!!state.agendas[agendaKey()];
}
function save(){try{sessionStorage.setItem(key,JSON.stringify(state))}catch{}render()}
el('session').onclick=()=>{const c=current();if(c.left>0){c.left--;if(c.left===2&&c.ok&&!c.created)c.created=now()}save()};
el('delivery').onclick=()=>{const c=current();if(c.created&&c.ok&&!c.delivered)c.delivered=now();save()};
el('consent').onchange=()=>{current().ok=el('consent').checked;save()};
el('ptSend').onclick=()=>{if(!el('ptSend').disabled)state.agendas[agendaKey()]=now();save()};
for(const id of ['client','trainer','day'])el(id).onchange=render;
for(const id of ['clients','trainers'])el(id).onclick=()=>{const pt=id==='trainers';el('ptPanel').hidden=!pt;el('clientPanel').hidden=pt;el('clients').setAttribute('aria-pressed',String(!pt));el('trainers').setAttribute('aria-pressed',String(pt));render()};
el('reset').onclick=()=>{state=fresh();save()};render();
</script></html>
