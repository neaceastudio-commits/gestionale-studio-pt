[build]
  publish = "gestionale-studio-pt-netlify/app/calendario-studio"
  command = "mkdir -p .netlify/calendar-functions && cp -R gestionale-studio-pt-netlify/netlify/functions/lib .netlify/calendar-functions/ && for name in acquisition-calendar-activity apple-caldav-link apple-calendar-dry-run apple-calendar calendar-activity calendar-runtime calendar-system-activity form-notify foto-pt pt-access-email schedule-client-package studio-calendar-activity whatsapp-agenda calendar-private-data; do cp gestionale-studio-pt-netlify/netlify/functions/$name.js .netlify/calendar-functions/; done && cp gestionale-studio-pt-netlify/netlify/functions/whatsapp-agenda-scheduled.mjs gestionale-studio-pt-netlify/netlify/functions/whatsapp-messages.mjs gestionale-studio-pt-netlify/netlify/functions/expected-renewals-scheduled.mjs gestionale-studio-pt-netlify/netlify/functions/anamnesis-submit.mjs gestionale-studio-pt-netlify/netlify/functions/whatsapp-matrix-scheduled.mjs gestionale-studio-pt-netlify/netlify/functions/whatsapp-matrix-worker-background.mjs .netlify/calendar-functions/ && cp gestionale-studio-pt-netlify/netlify/functions/birthdays-scheduled.mjs gestionale-studio-pt-netlify/netlify/functions/birthdays-sync-background.mjs .netlify/calendar-functions/ && node gestionale-studio-pt-netlify/tools/prepare-calendar-shared-function.cjs"
[functions]
  directory = ".netlify/calendar-functions"
[functions."birthdays-sync-background"]
  included_files = ["node_modules/fast-xml-parser/package.json", "node_modules/fast-xml-parser/lib/**"]
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
